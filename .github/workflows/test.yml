# Builds the game and runs the automated playtests on every push and pull request.
# Screenshots from every run are attached to the run as "playtest-screenshots".
name: Test
on:
  push:
  pull_request:
jobs:
  playtest:
    # pinned: the pinned Playwright (1.56) can't install browsers on ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-screenshots
          path: |
            test-results/
            playwright-report/
          retention-days: 14
