# Builds the game and runs the automated playtests on every push and pull request.
# Screenshots from every run are attached to the run as "playtest-screenshots-<screen size>".
name: Test
on:
  push:
  pull_request:
jobs:
  playtest:
    # one job per screen size, side by side: together they no longer fit in one job's time (2026-10-29)
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-1080p, phone-landscape, phone-portrait]
    # pinned: the pinned Playwright (1.56) can't install browsers on ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90  # software WebGL: the region playtests walk at a frame or two a second; the story plays scenes through
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck && npm run build && npm run build:legacy
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-screenshots-${{ matrix.project }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
