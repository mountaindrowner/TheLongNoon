# Publishes the latest game from main to GitHub Pages, so it can be played from any
# browser or phone at https://mountaindrowner.github.io/TheLongNoon/
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy play link
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm run build:legacy
      # the rebuild at /, the proof of concept it replaces at /legacy/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
